name: 錯誤回報 / Bug report
description: 回報可以重現的操作或程式問題
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感謝你協助改善工具。請勿上傳私人檔案、客戶資料或包含敏感路徑的完整報告。
  - type: input
    id: version
    attributes:
      label: 工具版本
      placeholder: 例如 v1.3.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 請依序說明如何遇到問題。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 實際結果或錯誤訊息
      description: 請先遮蔽姓名、客戶資料及私人路徑。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 資料安全確認
      options:
        - label: 我已確認內容不包含私人檔案、客戶資料或其他敏感資訊。
          required: true
